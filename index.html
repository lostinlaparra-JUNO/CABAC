/* VOICE: práctica y cálida, como una libreta de cocina que se usa a diario
   IDEA: el ticket de la compra: lo que vas a gastar, impreso y sumado
   PICTURE: un ticket de papel con dientes que suma Mercadona + mercado + droguería + farmacia
   COLOUR and TYPE: verde oliva, mostaza y terracota sobre crema (logo de Sora); Riffic Free Bold terracota para CABAÇ (tipografía de Sora, incrustada), Outfit + Figtree, Courier Prime en el ticket

.wm{font:700 30px/1 Riffic,Outfit,sans-serif;letter-spacing:.02em;color:#de5f44;text-shadow:0 1px 0 rgba(0,0,0,.25)}.wkl{display:block;font-size:13px;color:#d9efe2;margin-top:3px}
.top{box-shadow:inset 0 -5px 0 var(--esp)}
.totp{border:0;background:var(--paper);color:#222;font:700 18px 'Courier Prime',monospace;border-radius:10px;padding:6px 12px;min-height:44px;cursor:pointer;text-align:right;line-height:1.1}
.totp small{display:block;font:600 11px Figtree,sans-serif;color:#666}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:8;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tab{border:0;background:none;color:var(--mute);font:600 13px Figtree,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:60px;cursor:pointer;padding:6px 2px}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current=true]{color:var(--g)}.tab[aria-current=true] svg{stroke-width:2.6}
main{max-width:860px;margin:0 auto;padding:18px max(4vw,14px) 180px}
main h2{font-size:28px;margin-bottom:4px}
#cta{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom));z-index:7;padding:12px max(4vw,14px) 10px;background:linear-gradient(to bottom,transparent,var(--bg) 40%);pointer-events:none}
#cta:empty{display:none}
#cta .btn{pointer-events:auto;display:block;width:100%;max-width:860px;margin:0 auto;min-height:54px;font-size:17px;box-shadow:0 8px 20px -8px rgba(0,0,0,.4)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom));z-index:9;background:#1d2a22;color:#fff;font-size:14px;padding:10px 16px;border-radius:12px;max-width:min(92vw,520px);box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}
@media(min-width:900px){.bnav{position:sticky;top:64px;bottom:auto;display:flex;justify-content:center;gap:6px;border-top:0;border-bottom:1px solid var(--line);padding:6px}
.tab{flex-direction:row;font-size:16px;min-height:48px;padding:8px 18px;border-radius:10px;gap:8px}.tab[aria-current=true]{background:var(--soft)}
#cta{bottom:0}.toast{bottom:90px}}
.full{display:block;width:100%;margin-top:14px}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;color:var(--mute);font:600 14px Figtree,sans-serif;padding:8px 10px;border-radius:8px;min-height:38px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.m-tupper .seg button[aria-pressed=true]{background:var(--or);color:var(--on-or)}.m-fuera .seg button[aria-pressed=true]{background:var(--mute);color:#fff}
.meal2{padding:12px 0;border-top:1px solid var(--line)}.meal2:first-of-type{border-top:0}
.mh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}.ml{font-weight:600;color:var(--mute)}
.m-fuera input{display:none}.m-tupper input{border-color:var(--or);border-style:dashed}
.xrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;font-size:14px;color:var(--mute)}
.seg2{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:12px;padding:4px;gap:4px;margin-bottom:16px}
.seg2 button{border:0;background:none;color:var(--mute);font:600 15px Figtree,sans-serif;padding:10px 6px;border-radius:9px;min-height:46px;cursor:pointer}
.seg2 button[aria-pressed=true]{background:var(--card);color:var(--g);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.between{justify-content:space-between}
.pbar{height:10px;border-radius:5px;background:var(--soft);overflow:hidden;flex:1}.pbar i{display:block;height:100%;background:var(--g);border-radius:5px}
.prog2{display:flex;align-items:center;gap:12px;margin:8px 0 6px;font-weight:600;font-size:14px}
.rc.done{border-color:var(--g)}
.chosen{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px;background:var(--soft);border-radius:10px;padding:10px 12px}
.chosen b{flex:1 1 180px}.chosen .k{font-size:12px;font-weight:700;color:var(--or)}
.it2{display:grid;grid-template-columns:30px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.it2 input[type=checkbox]{width:26px;height:26px;min-height:0;accent-color:var(--g)}
.itb{display:flex;align-items:center;gap:10px;text-align:left;border:0;background:none;color:var(--ink);font:inherit;padding:4px 0;cursor:pointer;min-height:44px}
.itb .nm{display:block;font-weight:600;line-height:1.25}.itb .fm{display:block;font-size:13px;color:var(--mute)}
.it2.okk{box-shadow:inset 4px 0 var(--g);padding-left:10px}.it2.pend{box-shadow:inset 4px 0 var(--or);padding-left:10px}
.it2.done .nm,.it2.tengo .nm{text-decoration:line-through;color:var(--mute)}
.it2 .num{font-size:15px}
.itd{background:var(--soft);border-radius:12px;padding:12px;margin:4px 0 10px}
.itd .prl{display:flex;align-items:center;gap:8px;font-size:14px}.itd .prl input{width:110px;text-align:right}
.sup .it2{grid-template-columns:44px minmax(0,1fr) auto;padding:12px 0}.sup input[type=checkbox]{width:34px;height:34px}.sup .nm{font-size:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 15px Figtree,sans-serif;padding:8px 14px;border-radius:99px;min-height:42px;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--g);border-color:var(--g);color:#fff}
.mlist{display:grid;gap:10px}
.mbtn{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:16px;font:600 17px Figtree,sans-serif;cursor:pointer;min-height:64px}
.mbtn small{display:block;font:400 14px Figtree,sans-serif;color:var(--mute);margin-top:2px}.mbtn::after{content:"›";font-size:26px;color:var(--mute)}
.back{border:0;background:none;color:var(--g);font:600 16px Figtree,sans-serif;padding:6px 0;min-height:40px;cursor:pointer}
.share{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:24px}
.share .btn,.share a.btn{text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center}
.ticket{background:var(--paper);color:#222;font-family:'Courier Prime',monospace;padding:20px 22px 30px;border-radius:4px 4px 0 0;box-shadow:0 14px 26px -12px rgba(0,0,0,.45);max-width:380px;margin:6px auto 22px;
-webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/18px 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/18px 100%}
.ticket h3{font-family:inherit;text-align:center;font-size:17px}
.ticket .sub{text-align:center;font-size:13px;color:#666;border-bottom:1px dashed #999;padding-bottom:8px;margin-bottom:8px}
.tl{display:flex;justify-content:space-between;gap:10px;padding:3px 0;white-space:nowrap}.tl small{color:#777}
.tt{border-top:1px dashed #999;margin-top:8px;padding-top:8px;font-size:22px;font-weight:700}
.day{margin-bottom:14px}
.casa{border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;width:58px;min-height:48px;font:600 11px Figtree,sans-serif;cursor:pointer;padding:4px}
.casa svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
.casa.on{background:var(--g);border-color:var(--g);color:#fff}
.prox{margin-top:26px;border:2px dashed var(--esp);border-radius:16px;padding:14px;background:light-dark(#fff8e6,#221f10)}
.prox h3{font-size:19px}
.top .logo{border-radius:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:0;background:var(--g);color:#fff;font:600 16px Figtree,sans-serif;padding:11px 18px;border-radius:10px;min-height:44px;cursor:pointer}
.btn.alt{background:var(--soft);color:var(--g)}.btn.or{background:var(--or);color:var(--on-or)}
.btn:disabled{opacity:.5;cursor:default}
.mini{border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 14px Figtree,sans-serif;padding:6px 10px;border-radius:8px;min-height:36px;cursor:pointer}
.mini.on{background:var(--or);border-color:var(--or);color:var(--on-or)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--or);outline-offset:2px}
input,select{font:16px Figtree,sans-serif;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px;width:100%}
.lead{color:var(--mute);margin:6px 0 18px;max-width:70ch}
.day{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.day h3{font-size:20px;margin-bottom:10px}
.meal{display:grid;grid-template-columns:4.2em minmax(0,1fr) auto;gap:8px;align-items:center;margin-top:8px}
.meal label{font-size:14px;color:var(--mute);font-weight:600}
.meal input:disabled{background:var(--soft);color:var(--mute);font-style:italic}
.meal input.tup{border-color:var(--or);border-style:dashed}
.mb{display:flex;gap:4px}.mb .mini{padding:6px 8px}
.xt{font-size:13px;color:var(--or);font-weight:600;margin:2px 0 0 4.6em}
.ing{display:flex;flex-wrap:wrap;gap:8px;padding:10px;border:1px solid var(--line);border-radius:10px;margin-top:8px;background:var(--card)}
.ing.m{border-color:var(--or);background:var(--warn)}
.ing input,.ing select{flex:1 1 90px;width:auto}.ing input[data-f=nombre]{flex:3 1 200px}.ing input[data-f=formato]{flex:2 1 170px}.ing select[data-f=seccion]{flex:2 1 170px}
.fl{display:block;font-weight:600;margin-top:14px}.fl input,.fl textarea{margin-top:6px}
textarea{font:16px/1.5 Figtree,sans-serif;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
.alt{margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--soft)}
.altc{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}
.altc.sel .nm::after{content:" ✓";color:var(--g)}
a.mini{display:inline-flex;align-items:center;text-decoration:none}
.th{width:48px;height:48px;object-fit:cover;border-radius:8px;flex:none;background:var(--soft)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:baseline}.dot.g{background:var(--g)}.dot.o{background:var(--or)}
.it.okk{box-shadow:inset 4px 0 var(--g);padding-left:12px}.it.pend{box-shadow:inset 4px 0 var(--or);padding-left:12px}
.tray{border:2px solid var(--or);border-radius:16px;padding:16px;margin:8px 0 18px;background:var(--warn)}
.tray h3{font-size:22px;color:var(--warnink)}
.tc{padding:14px 0;border-top:1px dashed var(--line)}.tc:first-of-type{border-top:0}
.tch{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}.tch b{font-size:18px}
.opts4{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.optc{display:flex;flex-direction:column;gap:4px}
.optc button{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px;cursor:pointer;font:15px/1.35 Figtree,sans-serif;min-height:96px;height:100%}
.optc button:hover{border-color:var(--g)}.optc .th{margin-bottom:4px}
.optc .o1{font-weight:600}.optc .pz{font:700 17px 'Courier Prime',monospace;color:var(--g)}.optc .pz small{font:13px Figtree,sans-serif;color:var(--mute)}
.optc a{font-size:13px;color:var(--g);padding-left:4px}
.okbar{background:var(--soft);color:var(--g);font-weight:600;border-radius:12px;padding:12px 16px;margin:8px 0 18px}
.sbox{position:relative;margin:4px 0 14px;scroll-margin-top:76px}
@media(max-width:899px){.typing #cta,.typing .bnav,.typing .toast{display:none}.typing main{padding-bottom:60vh}}.sbox input{font-size:17px;padding:14px 16px;border-width:2px}
.sug{border:1px solid var(--line);border-radius:12px;margin-top:6px;background:var(--card);overflow:hidden}
.sgi{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);padding:10px 12px;font:15px Figtree,sans-serif;cursor:pointer;min-height:56px}
.sgi:hover,.sgi:focus-visible{background:var(--soft)}
.sgh{font-size:12px;font-weight:700;color:var(--mute);padding:8px 12px 2px}.sgplus{font-weight:700;color:var(--g);white-space:nowrap;font-size:14px}
.sgm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px}
label.mini{display:inline-flex;align-items:center}
.pmb{margin:10px 0 4px}.pmb input{border-style:dashed}.pmb .sgi{border:1px solid var(--g);border-radius:10px;margin-top:6px}
.tx{margin-top:12px;font-size:15px;border-top:1px dashed var(--line);padding-top:10px}
@media(max-width:420px){.meal{grid-template-columns:minmax(0,1fr) auto}.meal label{grid-column:1/-1;margin-bottom:-4px}.xt{margin-left:0}}
.rc{border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px;background:var(--card)}
.rc h3{font-size:20px}.rc .when{font-size:14px;color:var(--mute);font-weight:600}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.op{border:2px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;background:var(--bg)}
.op.sel{border-color:var(--g);background:var(--soft)}
.op .k{font-size:13px;font-weight:600;color:var(--or)}
.op h4{margin:2px 0 4px;font:600 17px Outfit,sans-serif}
.op p{margin:4px 0;font-size:14px;color:var(--mute)}
.op ul,.op ol{margin:6px 0;padding-left:20px;font-size:14px}
details summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--g);padding:6px 0}
.cos{background:var(--soft);border-radius:8px;padding:8px 10px;font-size:14px;margin-top:6px}
.sec{margin:22px 0 6px;font-size:15px;font-weight:600;color:var(--g);border-bottom:2px solid var(--soft);padding-bottom:4px}
.it{display:grid;grid-template-columns:28px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.it input[type=checkbox]{width:24px;height:24px;min-height:0;accent-color:var(--g)}
.it .nm{font-weight:600}.it .fm{font-size:13px;color:var(--mute)}
.it.done .nm,.it.tengo .nm{text-decoration:line-through;color:var(--mute)}
.qty{display:flex;align-items:center;gap:4px;white-space:nowrap}
.qty button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;cursor:pointer}
.pr{width:96px;text-align:right}.pr input{text-align:right;padding:8px}
.est{font-size:12px;color:var(--mute);text-align:right;white-space:nowrap}
.acts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.add{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.3fr) 90px 80px auto;gap:8px;margin-top:14px;align-items:end}
.add2{display:grid;grid-template-columns:minmax(0,2fr) 80px 96px auto;gap:8px;margin-top:10px}
.lists{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.box{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--card)}
.box h3{font-size:19px;display:flex;justify-content:space-between;gap:8px}.box h3 span{font-family:'Courier Prime',monospace;white-space:nowrap}
.hist .hr{display:grid;grid-template-columns:8em minmax(0,1fr) 6.5em;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.bar{height:14px;border-radius:7px;background:var(--soft);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.num{text-align:right;font-family:'Courier Prime',monospace;font-weight:700;white-space:nowrap}
.empty{background:var(--soft);border-radius:14px;padding:22px;color:var(--mute)}
.prog{font-weight:600;color:var(--or)}
.note{font-size:13px;color:var(--mute)}
@media(max-width:700px){
.opts{grid-template-columns:minmax(0,1fr)}.add{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.add .btn{grid-column:1/-1}
.it{grid-template-columns:28px minmax(0,1fr) auto}.it .pr{grid-column:2/-1;justify-self:end;display:flex;gap:8px;align-items:center;width:auto}.it .pr input{width:96px}
.hist .hr{grid-template-columns:6em minmax(0,1fr) 5.5em}}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
#login{display:none}
.nolog #login{display:flex;position:fixed;inset:0;z-index:30;background:var(--band);align-items:center;justify-content:center;padding:24px}
.lbox{background:var(--card);color:var(--ink);border-radius:20px;padding:28px 22px;width:min(100%,400px);text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.lbox img{width:96px;height:96px;border-radius:22px}.lbox .wm{font-size:40px;margin:10px 0 6px}
.lbox input{margin-top:14px;text-align:center}.lbox .btn{width:100%;margin-top:10px}
#lmsg{min-height:1.5em;margin-top:12px}
</style>

function tam(f){const t=norm(f).replace(/(\d),(\d)/g,'$1.$2');let m=t.match(/(\d+)\s*x\s*(\d+(?:\.\d+)?)\s*(kg|g|ml|l)\b/);if(m)return conv(+m[1]*+m[2],m[3]);

function parseM(txt){const t=String(txt||'').replace(/\s+/g,' ').trim();if(t.length<4)return null;

  return{n,f,p,sec:guessSec(n)}}

  if(px)return`<div class="sug"><button class="sgi" data-act="regm"><span><b>Añadir de Mercadona: ${esc(px.n)}</b><br><span class="fm">${esc(px.f)} · ${px.p!=null?eur(px.p):'sin precio'} · ${esc(px.sec)}</span></span></button></div>`;
  const w=q.split(/\s+/);
  const F=busca(qAdd,6,true),P=busca(qAdd,8).filter(c=>!F.some(f=>f.k===c.k)).slice(0,Math.max(0,5-F.length)),Q=esc(qAdd.trim());
  const fila=c=>`<button class="sgi" data-act="cadd" data-c="${esc(c.k)}">${foto(c.k)}<span style="flex:1"><b>${esc(c.n)}</b><br><span class="fm">${esc(c.f)} · ${eur(c.p)}</span></span><span class="sgplus">+ Añadir</span></button>`;
  const nuevo=`<button class="sgi" data-act="addgen"><span style="flex:1"><b>Añadir «${Q}»</b><br><span class="fm">${F.length?'Como producto nuevo, sin concretar':'No está en tus productos: se añade tal cual'}</span></span><span class="sgplus">+ Añadir</span></button>`;
  return`<div class="sug">${F.length?`<div class="sgh">En tus productos</div>${F.map(fila).join('')}${nuevo}`:`${nuevo}`}${P.length?`<div class="sgh">Parecidos (no es lo mismo)</div>${P.map(fila).join('')}`:''}
<div class="sgm"><a class="mini" href="${esc(mLink(qAdd.trim()))}">Buscarlo en Mercadona</a><button class="mini" data-act="addprox">Para la próxima semana</button>
<span class="fm" style="flex-basis:100%">En Mercadona, copia el producto (nombre, formato y precio) o pulsa Compartir › Cabaç, y se añade con su precio.</span></div></div>`}

${A.length?A.map(c=>{const cv=cubre(i,c);return`<div class="altc ${norm(c.n)===norm(i.producto)&&norm(c.f)===norm(i.formato)?'sel':''}"><div class="row" style="flex-wrap:nowrap">${foto(c.k)}<div><div class="nm">${esc(c.n)}</div><div class="fm">${esc(c.f)} · ${eur(c.p)}${cv.txt?' · '+esc(cv.txt):''}</div></div></div>
<div class="acts"><a class="mini" href="${esc(mLink(c.n))}">Ver foto</a><button class="mini on" data-act="pick" data-id="${i.id}" data-c="${esc(c.k)}">Elegir</button></div></div>`}).join('')

function marcaB(x){S.borr=(S.borr||[]);S.borr.push(x);if(S.borr.length>400)S.borr=S.borr.slice(-400)}
function fusiona(R){const del=new Set([...(R.borr||[]),...(S.borr||[])]);
  for(const L of ['compra','otras']){const ids=new Set((S[L]||[]).map(i=>i.id));for(const i of (R[L]||[]))if(!ids.has(i.id))S[L].push(i);S[L]=S[L].filter(i=>!del.has(i.id))}
  {const ids=new Set((S.proxima||[]).map(x=>x.id));S.proxima=[...(S.proxima||[]),...(R.proxima||[]).filter(x=>!ids.has(x.id)&&!del.has(x.id))]}
  for(const K of ['catalogo','vinculos','fotos','precios','fijos']){const m=Object.assign({},R[K]||{},S[K]||{});for(const k in m)if(del.has('c:'+k)&&K==='catalogo')delete m[k];S[K]=m}
  const lb=new Set((S.libro||[]).map(r=>r.id));for(const r of (R.libro||[]))if(!lb.has(r.id)&&!del.has('r:'+r.id))S.libro.push(r);S.libro=S.libro.filter(r=>!del.has('r:'+r.id));
  for(const k in (R.menu||{}))if(!S.menu[k])S.menu[k]=R.menu[k];
  S.borr=[...del].slice(-400)}
function puestosDe(k){return Object.values(S.menu).filter(v=>v&&v.de===k).length}
function rPon(c){const all=comidas(),i=all.findIndex(x=>x.k===c.k);
  const libres=all.slice(i+1).filter(x=>(!x.plato&&!x.fuera&&!x.tupper)||(S.menu[x.k]||{}).de===c.k),n=puestosDe(c.k);
  return`<div class="row tx"><span>Colocar tupper (${n}/${c.extra}):</span>${libres.length?libres.map(x=>{const on=(S.menu[x.k]||{}).de===c.k;
  return`<button class="mini ${on?'on':''}" data-act="pon" data-k="${x.k}" data-de="${c.k}" aria-pressed="${on}">${DIAS[x.d].slice(0,3)} · ${x.m}</button>`}).join(''):'<span class="note">No quedan huecos libres en los días siguientes.</span>'}</div>`}
function totales(){
  const est=S.compra.filter(i=>!i.tengo).reduce((a,i)=>a+(+i.envases||0)*(+i.precio||0),0),m=S.real?S.real.total:est;
  const o={};let sin=0;
  for(const L of OTRAS)o[L.k]=S.otras.filter(i=>i.lista===L.k).reduce((a,i)=>{if(i.precio==null){sin++;return a}return a+(+i.cant||1)*i.precio},0);
  return{m,est,o,sin,t:m+Object.values(o).reduce((a,b)=>a+b,0)};
}

  const p=`Este texto está copiado de la web o la app de Mercadona. Extrae cada producto: nombre, formato (envase y tamaño, p. ej. "bandeja 400 g aprox.") y precio actual por unidad o pack en euros (ignora precios por kilo o litro y los precios anteriores tachados). Asigna la sección: exactamente una de ${JSON.stringify(SECC)}.
Texto:
${txt.slice(0,12000)}
Responde SOLO con un array JSON válido: [{"producto":"","formato":"","precio":0,"seccion":""}]`;
  try{const arr=await askJSON(p);const hoy=new Date().toISOString().slice(0,10);let n=0;
    for(const x of (Array.isArray(arr)?arr:[])){const pr=num(x.precio);if(!x.producto||pr==null)continue;
      const k=String(x.producto).trim()+(x.formato?', '+String(x.formato).trim():'');S.catalogo[k]={precio:pr,f:hoy,sec:SECC.includes(x.seccion)?x.seccion:'Otros'};n++}
    impMsg=n?`Añadidos o actualizados ${n} producto${n>1?'s':''}.`:'No he encontrado productos con precio en el texto.';save()}
  catch(e){errIA(e);impMsg='No he podido leer el texto.'}
  busy='';render()}

async function askJSON(p){
  if(sample.json)return await sample.json(p,{modelTier:'default'});
  const r=await sample(p,{modelTier:'default'});const m=r.text.match(/[\[{][\s\S]*[\]}]/);return JSON.parse(m[0]);
}
function errIA(e){if(e&&e.code==='not_granted'){sample=null;status('Sin permiso para preguntar a Claude.')}else if(e&&e.code==='rate_limited')status('Demasiadas peticiones seguidas; espera un minuto y vuelve a probar.');else status('No he podido traer la respuesta; prueba otra vez.')}

const pReceta=(c,prev)=>`Eres una cocinera doméstica española. Propón recetas para 2 personas para este plato del menú semanal: "${c.plato}" (${c.m==='comida'?'comida de mediodía':'cena'}).
Condiciones: recetas sencillas y ligeras, fáciles de digerir, porque una de las dos personas se nota el estómago inflamado con comidas pesadas. Evita sofritos largos y grasientos, fritos en aceite, legumbres en guiso contundente (si hay legumbre, que sea suave, poca cantidad o en crema/ensalada), nata, embutidos grasos, rebozados y picante fuerte. Si el plato pedido es pesado, propón una versión aligerada reconocible.${c.m==='cena'?' Al ser cena, más ligera todavía.':''}${prev?` No repitas estas recetas: ${prev}.`:''}
Da 2 opciones:
- "tradicional": cocinada al fuego, plancha, vapor u horno.
- "cosori": hecha en la freidora de aire Cosori Dual Blaze TwinFry de 10 L (dos zonas de 5 L que también se usan juntas como una de 10 L, calor por arriba y por abajo). En el campo "cosori" indica qué va en cada zona, temperatura y minutos, y usa la sincronización para que terminen a la vez si usas las dos.
Cantidades para 2 personas. Ingredientes con nombre sencillo de supermercado; unidad: g, ml, ud, cda o cdta.
Responde SOLO con JSON válido, sin texto alrededor:
{"tradicional":{"nombre":"","minutos":0,"por_que_ligera":"una frase","ingredientes":[{"nombre":"","cantidad":0,"unidad":"g"}],"pasos":["paso corto"],"cosori":""},"cosori":{"nombre":"","minutos":0,"por_que_ligera":"","ingredientes":[],"pasos":[],"cosori":"Zona 1: ... · Zona 2: ..."}}`;

async function buscar(keys,otras){
  for(let n=0;n<keys.length;n++){const c=comidas().find(x=>x.k===keys[n]);if(!c||!sample)break;
    busy=`Buscando ${n+1} de ${keys.length}: ${c.plato}…`;render();
    const prev=otras&&S.recetas[c.k]?S.recetas[c.k].op.map(r=>r&&r.nombre).filter(Boolean).join('; '):'';
    try{const r=await askJSON(pReceta(c,prev));
      if(r&&r.tradicional){S.recetas[c.k]={plato:c.plato,op:[r.tradicional,r.cosori||null]};delete S.elegida[c.k];save()}}
    catch(e){errIA(e);if(e&&(e.code==='not_granted'||e.code==='rate_limited'))break}}
  busy='';render();
}

function hashLista(){return comidas().filter(cocina).map(c=>{const r=elegidaDe(c);return r?c.k+':'+r.nombre+':'+c.extra:''}).join('|')}
let autoT=null;function autoLista(){if(busy||tab!=='compra'||superM)return;const h=hashLista();if(!h.replace(/\|/g,'')||h===S.listaHash)return;clearTimeout(autoT);autoT=setTimeout(()=>{if(!busy&&hashLista()!==S.listaHash)hacerLista()},150)}
async function hacerLista(){const prev=S.compra.filter(i=>i.origen==='auto'),keep=(arr)=>{for(const n of arr){const o=prev.find(x=>norm(x.ing||x.producto)===norm(n.ing||n.producto));if(o){n.tengo=o.tengo;n.hecho=o.hecho}}return arr};S.listaHash=hashLista();
  const sel=comidas().filter(cocina).map(c=>({c,r:elegidaDe(c)})).filter(x=>x.r);
  const lines=[],ex={};
  for(const {c,r} of sel){const f=(2+c.extra)/2,dd=`${DIAS[c.d].slice(0,3)} ${c.m}`;for(const g of (r.ingredientes||[])){if(!g.nombre)continue;
    if(g.merc){const key=pkey(g.nombre,g.formato),n=Math.max(1,Math.round(num(g.cantidad)||1));
      if(ex[key]){ex[key].envases+=n;ex[key].para+=', '+dd}
      else{const mem=S.precios[key];ex[key]={id:uid(),ing:String(g.nombre),producto:String(g.nombre),formato:String(g.formato||''),envases:n,precio:mem!=null?mem:num(g.precio),estimado:false,seccion:SECC.includes(g.seccion)?g.seccion:'Otros',para:dd,sobra:'',tengo:false,hecho:false,origen:'auto'}}}
    else{const q=num(g.cantidad);lines.push(`- ${g.nombre}: ${q!=null?Math.round(q*f*10)/10:g.cantidad} ${g.unidad} (${dd}: ${r.nombre}${c.extra?`, ${2+c.extra} raciones con tupper`:''})`)}}}
  const exact=Object.values(ex).map(aplicaV);
  if(!lines.length||!sample){if(lines.length)status('Sin permiso para preguntar a Claude: solo he añadido los productos tal cual de Mercadona.');
    S.compra=[...keep(exact),...S.compra.filter(i=>i.origen==='manual')];save();tab='compra';render();return}
  busy='Actualizando la lista con las recetas…';render();
  const p=`Convierte estos ingredientes (recetas de una semana para 2 personas) en la lista de la compra de Mercadona (España).
- Une los repetidos y suma cantidades.
- Pásalo al formato en que lo vende Mercadona (p. ej. producto "Cebolla", formato "malla 1 kg"; "Huevos L", "docena"; "Pechuga de pollo fileteada", "bandeja aprox. 500 g") y calcula cuántos envases hacen falta, redondeando hacia arriba.
- precio: precio aproximado por envase en Mercadona en euros (tu mejor estimación actual).
- seccion: exactamente una de ${JSON.stringify(SECC)}.
- basico: true si es de despensa que casi siempre hay en casa (sal, aceite de oliva, pimienta, especias, vinagre, ajo en polvo).
- para: a qué días o platos va, muy corto.
- sobra: si sobra bastante, frase muy corta de cómo aprovecharlo; si no, "".
- ingrediente: nombre genérico y corto del ingrediente como lo pide la receta (p. ej. "lubina", "calabacín").

async function aImagen(file,mx=1800){const url=URL.createObjectURL(file);try{const img=await new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ko;i.src=url});
  const sc=Math.min(1,mx/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);return await new Promise(ok=>c.toBlob(ok,'image/jpeg',.85))}finally{URL.revokeObjectURL(url)}}

async function leerTicket(){
  const f=$('#tkImg')&&$('#tkImg').files[0],txt=($('#tkTxt')||{}).value||'';
  if(!f&&!txt.trim()){ticketMsg='Sube una foto o pega el texto primero.';render();return}
  busy='Leyendo el ticket…';ticketMsg='';render();
  const p=`${f?'La imagen es':'Este texto es'} un ticket de compra de Mercadona. Extrae cada línea de producto.
Empareja cada línea con un artículo de mi lista si es el mismo producto (pon su id), o null si no está.
Mi lista: ${JSON.stringify(S.compra.map(i=>({id:i.id,p:(i.producto+' '+i.formato).trim()})))}
Para productos a peso, unidades = 1 y precio_unidad = importe.
${txt.trim()?'Texto del ticket:\n'+txt.slice(0,6000):''}
Responde SOLO con JSON válido: {"total":0,"lineas":[{"producto":"nombre tal cual en el ticket","unidades":1,"precio_unidad":0,"importe":0,"id":null}]}`;
  try{let r;const o={modelTier:'default'};if(f)o.images=[await aImagen(f)];
    if(sample.json)r=await sample.json(p,o);else{const a=await sample(p,o);r=JSON.parse(a.text.match(/\{[\s\S]*\}/)[0])}
    const L=Array.isArray(r&&r.lineas)?r.lineas:[];let act=0;const hoy=new Date().toISOString().slice(0,10);
    for(const l of L){const pu=num(l.precio_unidad);if(pu==null||!l.producto)continue;
      S.catalogo[String(l.producto).trim()]={precio:pu,f:hoy};
      const i=S.compra.find(x=>x.id===l.id);if(i){i.precio=pu;i.estimado=false;S.precios[pkey(i.producto,i.formato)]=pu;act++}}
    const tot=num(r&&r.total)??L.reduce((a,l)=>a+(num(l.importe)||0),0);
    if(L.length){S.real={total:tot};ticketMsg=`Leído: ${L.length} líneas, ${act} precios de la lista actualizados, total ${eur(tot)}.`}else ticketMsg='No he encontrado líneas de producto; prueba con una foto más nítida o pega el texto.';
    save()}
  catch(e){errIA(e);ticketMsg='No he podido leer el ticket.'}
  busy='';render();
}

  if(t.dataset.oprecio){const i=S.otras.find(x=>x.id===t.dataset.oprecio);if(i){i.precio=num(t.value);if(i.precio!=null)S.precios['otras:'+i.producto.toLowerCase()]=i.precio;save();render()}}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,p=(f.elements.p||{value:''}).value.trim();if(!p)return;
  if(f.id==='addP'){S.proxima=S.proxima||[];S.proxima.push({id:uid(),producto:p,formato:'',precio:S.precios[pkey(p,'')]??null,seccion:guessSec(p)})}
  else if(f.id==='addC'){const pr=num(f.pr.value);if(pr==null){status('Pon el precio.');return}S.catalogo[p+(f.f.value.trim()?', '+f.f.value.trim():'')]={precio:pr,f:new Date().toISOString().slice(0,10),sec:f.s.value};impMsg='Añadido «'+p+'».'}
  else if(f.id==='addM'){const pr=num(f.pr.value),mem=S.precios[pkey(p,'')];S.compra.push({id:uid(),producto:p,formato:'',envases:Math.max(1,+f.n.value||1),precio:pr!=null?pr:(mem??null),estimado:false,seccion:f.s.value,para:'',sobra:'',tengo:false,hecho:false,origen:'manual'});if(pr!=null)S.precios[pkey(p,'')]=pr}
  else if(f.dataset.lista){const pr=num(f.pr.value),mem=S.precios['otras:'+p.toLowerCase()];S.otras.push({id:uid(),lista:f.dataset.lista,producto:p,cant:Math.max(1,+f.n.value||1),precio:pr!=null?pr:(mem??null),hecho:false});if(pr!=null)S.precios['otras:'+p.toLowerCase()]=pr}
  save();render();});

function entrante(){let p;try{p=new URLSearchParams(location.search)}catch(e){return}const t=[p.get('title'),p.get('text')].filter(Boolean).join(' ').trim();if(!t&&!p.get('url'))return;
  const limpio=t.replace(/https?:\/\/\S+/g,'').replace(/\s*[|·–-]\s*Mercadona.*$/i,'').replace(/^[¡!¿\s]*(mira|echa un vistazo|te comparto|descubre|he encontrado)[^:!]*[:!]*\s*/i,'').replace(/^[\s:!¡.,-]+|[\s:!¡.,-]+$/g,'').replace(/\s+/g,' ').trim();
  const uu=p.get('url')||(t.match(/https?:\/\/\S+/)||[])[0]||'';let deUrl='';
  try{const mm=decodeURIComponent(uu).match(/mercadona\.es\/product\/\d+\/([a-z0-9-]+)/i);if(mm){deUrl=mm[1].replace(/-/g,' ').trim();deUrl=deUrl.charAt(0).toUpperCase()+deUrl.slice(1)}}catch(e){}
  try{history.replaceState(null,'',location.pathname)}catch(e){}
  if(!limpio&&!deUrl)return;
  if(!limpio||/^(mira|echa un vistazo|te comparto|descubre)/i.test(limpio)&&deUrl)p.set('title',deUrl);
  const limpio2=limpio||deUrl;let x=null;const ti=(p.get('title')||'').replace(/\s*[|·–-]\s*Mercadona.*$/i,'').trim();
  if(ti){const tx=(p.get('text')||'').replace(/https?:\/\/\S+/g,' ');const y=parseM('x '+tx),pp=tx.match(/(\d+(?:[.,]\d+)?)\s*€\s*(?:\/\s*)?(?:por\s*)?(?:unidad|ud\.?|pack)?/i);x={n:ti,f:y?y.f:'',p:y&&y.p!=null?y.p:(pp?num(pp[1]):null),sec:guessSec(ti)};if(!y&&x.p==null){const z=parseM(limpio2);if(z&&z.n.length>=ti.length-2)x=z}}else x=parseM(limpio2);
  if(x){regCat(x);S.compra.push({id:uid(),ing:x.n,ok:true,producto:x.n,formato:x.f,envases:1,precio:x.p,estimado:false,seccion:x.sec,para:'',sobra:'',tengo:false,hecho:false,origen:'manual'})}
  else S.compra.push(aplicaV({id:uid(),ing:limpio2,producto:limpio2,formato:'',envases:1,precio:S.precios[pkey(limpio2,'')]??null,estimado:false,seccion:guessSec(limpio2),para:'',sobra:'',tengo:false,hecho:false,origen:'manual'}));
  tab='compra';save();render();status('«'+(x?x.n:limpio2)+'» añadido a la lista.')}
async function buzon(){if(!db)return;try{const ref=db.doc('app/importar'),v=val(await ref.get());
  if(v&&v.menu&&typeof v.menu==='object'){for(const [k,x] of Object.entries(v.menu))if(/^\d-(comida|cena)$/.test(k)&&x&&typeof x==='object')S.menu[k]=Object.assign(S.menu[k]||{},{plato:String(x.plato??(S.menu[k]||{}).plato??''),fuera:!!x.fuera,tupper:!!x.tupper});if(!v.catalogo){await ref.delete();save();render()}}
  if(v&&v.catalogo&&typeof v.catalogo==='object'){let n=0;for(const [k,x] of Object.entries(v.catalogo)){const p=num(x&&x.precio);if(p==null)continue;S.catalogo[String(k)]={precio:p,f:String(x.f||''),sec:SECC.includes(x.sec)?x.sec:'Otros'};n++}
    await ref.delete();if(n){save();render();status(n+' producto'+(n>1?'s':'')+' nuevos en el catálogo ✓')}}}catch(e){}}
let diferido=false;
function aplicaRemoto(v){const L=S,R=Object.assign(blank(),JSON.parse(v.json)),del=new Set(R.borr||[]);
  for(const K of ['catalogo','vinculos','fotos','precios']){const m=Object.assign({},L[K]||{},R[K]||{});if(K==='catalogo')for(const k in m)if(del.has('c:'+k))delete m[k];R[K]=m}
  S=R;lastAt=v.at;arregla();
  const ae=document.activeElement;if(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)&&$('#view').contains(ae)){if(!diferido){diferido=true;ae.addEventListener('blur',()=>{diferido=false;render()},{once:true})}rTicket()}else render();
  }
function escucha(){try{const ref=db.doc('app/estado');if(typeof ref.onSnapshot!=='function')return;
  ref.onSnapshot(snap=>{const v=val(snap);if(v&&v.json&&v.at>lastAt&&!pend&&!busy)aplicaRemoto(v)},()=>{})}catch(e){}}
setInterval(()=>{if(!document.hidden)refrescar()},20000);
async function refrescar(){if(!db||pend||busy)return;try{const v=val(await db.doc('app/estado').get());
  if(v&&v.json&&v.at>lastAt&&!pend)aplicaRemoto(v)}catch(e){}buzon()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refrescar()});
window.addEventListener('focus',refrescar);
arregla();render();
const C=window.claude;
if(C&&C.use){
  C.use('sample').then(async s=>{sample=s;try{imgOK=!!(s&&s.limits&&(await s.limits()).images)}catch(e){}render()}).catch(()=>{});
  C.use('assets').then(a=>{assets=a;if(a)render()}).catch(()=>{});
  C.use('db').then(async d=>{if(!d){status('Guardado solo en este navegador.');return}db=d;
    const timer=setTimeout(()=>status('La nube tarda en responder; se guarda en este navegador.'),10000);
    try{const snap=await db.doc('app/estado').get();clearTimeout(timer);
      const v=val(snap);
      if(v&&v.json){S=Object.assign(blank(),JSON.parse(v.json));lastAt=v.at||0;render()}buzon();if(arregla())render();escucha();entrante()}
    catch(e){clearTimeout(timer);status('No se pudo leer la nube; uso lo guardado en este navegador.')}}).catch(()=>{});
}
}
</script>
