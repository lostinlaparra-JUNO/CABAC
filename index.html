/* VOICE: práctica y cálida, como una libreta de cocina que se usa a diario
   IDEA: el ticket de la compra: lo que vas a gastar, impreso y sumado
   PICTURE: un ticket de papel con dientes que suma Mercadona + mercado + droguería + farmacia
   COLOUR and TYPE: verde oliva, mostaza y terracota sobre crema (logo de Sora); Riffic Free Bold terracota para CABAÇ (tipografía de Sora, incrustada), Outfit + Figtree, Courier Prime en el ticket

.wm{font:400 27px/1 Righteous,Outfit,sans-serif;letter-spacing:.06em;color:var(--g);text-shadow:1.5px 1.5px 0 var(--band),3px 3px 0 var(--esp)}.wkl{display:block;font-size:13px;color:var(--mute);margin-top:3px}

.totp{border:1px solid var(--line);background:var(--card);color:var(--or);font:700 18px 'Courier Prime',monospace;border-radius:10px;padding:6px 12px;min-height:44px;cursor:pointer;text-align:right;line-height:1.1}
.totp small{display:block;font:600 11px Figtree,sans-serif;color:#666}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:8;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tab{border:0;background:none;color:var(--mute);font:600 13px Figtree,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:60px;cursor:pointer;padding:6px 2px}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current=true]{color:var(--g)}.tab[aria-current=true] svg{stroke-width:2.6}
main{max-width:860px;margin:0 auto;padding:18px max(4vw,14px) 180px}
main h2{font-size:28px;margin-bottom:4px}
#cta{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom));z-index:7;padding:12px max(4vw,14px) 10px;background:linear-gradient(to bottom,transparent,var(--bg) 40%);pointer-events:none}
#cta:empty{display:none}
#cta .btn{pointer-events:auto;display:block;width:100%;max-width:860px;margin:0 auto;min-height:54px;font-size:17px;box-shadow:0 8px 20px -8px rgba(0,0,0,.4)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom));z-index:9;background:#1d2a22;color:#fff;font-size:14px;padding:10px 16px;border-radius:12px;max-width:min(92vw,520px);box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}.toast.act{pointer-events:auto;display:flex;align-items:center;gap:4px;width:min(92vw,420px);justify-content:space-between}.toast .undo{flex:none;white-space:nowrap}.toast .undo{margin-left:12px;border:0;background:none;color:#cfe0a8;font:700 14px Figtree,sans-serif;text-decoration:underline;cursor:pointer;min-height:32px}
.pbar{display:flex;gap:10px;align-items:center;width:100%;border:0;background:var(--warn);color:var(--warnink);font:600 15px Figtree,sans-serif;border-radius:12px;padding:12px 14px;margin:12px 0 6px;cursor:pointer;text-align:left;min-height:48px}.pbar .chev{margin-left:auto;font-size:20px;line-height:1}
.pd{width:9px;height:9px;border-radius:50%;background:var(--or);flex:none}
.it2{background:var(--bg);transition:background .15s}.it2.swl{background:var(--warn)}.it2.swr{background:var(--soft)}
.it2.pend .nm::after{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--or);margin-left:7px;vertical-align:middle}
.hint{font-size:13px;color:var(--mute);text-align:center;margin:10px 0 0}
.ordr{display:grid;grid-template-columns:minmax(0,1fr) 44px 44px;gap:6px;align-items:center;padding:4px 0;border-bottom:1px solid var(--line)}.ordr button{min-height:40px;border:1px solid var(--line);background:var(--card);border-radius:10px;font-size:18px;cursor:pointer;color:var(--g)}.ordr button:disabled{opacity:.3}
.supbar{position:sticky;top:66px;z-index:5;background:var(--bg);padding:10px 0 12px;font-size:18px}.supbar .pbr{height:8px;border-radius:4px;background:var(--line);margin-top:8px;overflow:hidden}.supbar .pbr i{display:block;height:100%;background:var(--g);transition:width .3s}
.mline{display:grid;grid-template-columns:64px minmax(0,1fr) auto 14px;gap:10px;align-items:center;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:12px 0;text-align:left;font:16px/1.3 Figtree,sans-serif;color:var(--ink);cursor:pointer;min-height:48px}.day h3+.mline{border-top:0}
.mline .ml{font-size:13px;color:var(--mute);font-weight:600}.mline .mp{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mline .mp.vac{color:var(--mute)}.mline .chev{color:var(--mute);font-size:20px}
.tag{font-size:12px;font-weight:600;color:var(--g);background:var(--soft);border-radius:20px;padding:3px 9px;white-space:nowrap}
.lds{margin:10px 0 2px}.lds .lt{font-size:13px;font-weight:600;color:var(--mute);display:block;margin-bottom:6px}.lds .chips{display:flex;flex-wrap:nowrap;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.lds .chips button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:7px 12px;font:600 14px Figtree,sans-serif;cursor:pointer;white-space:nowrap;min-height:38px}.lds .chips button::before{content:'+ ';color:var(--g)}
.por{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--esp);color:#fff;font-size:11px;font-weight:700;margin-left:6px;vertical-align:1px}
.it2.nuevo{background:var(--soft);box-shadow:inset 4px 0 var(--esp);padding-left:10px}
#cook{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) max(5vw,18px) max(18px,env(safe-area-inset-bottom))}
#cook .ch{display:flex;align-items:center;gap:10px}#cook .ch b{flex:1;font:400 20px Righteous,Outfit,sans-serif;color:var(--g)}#cook .x{border:1px solid var(--line);background:var(--card);border-radius:12px;min-width:48px;min-height:48px;font-size:20px;cursor:pointer}
#cook .cn{color:var(--mute);font-weight:600;margin:14px 0 4px}#cook .cs{flex:1;overflow:auto;font-size:25px;line-height:1.4}#cook .cs ul{font-size:20px;padding-left:22px}
#cook .tm{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}#cook .tm button{border:0;background:var(--soft);color:var(--g);border-radius:12px;padding:10px 14px;font:700 17px Figtree,sans-serif;cursor:pointer;min-height:48px}
#cook .run{background:var(--g);color:#fff;border-radius:12px;padding:10px 14px;font:700 22px 'Courier Prime',monospace;display:flex;justify-content:space-between;align-items:center;margin:8px 0}#cook .run button{border:0;background:none;color:#fff;font:600 14px Figtree,sans-serif;text-decoration:underline;cursor:pointer}
#cook .nv{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:12px}#cook .nv .btn{min-height:60px;font-size:18px}
.mopen{border-top:1px solid var(--line);padding-bottom:10px}
.ctx{font-size:14px;color:var(--mute);margin:8px 0 0}.ctx b{color:var(--ink)}.ctx .up{color:var(--warnink)}.ctx .dn{color:var(--g)}
.fil{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 14px}.fil button{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 12px;font:600 14px Figtree,sans-serif;cursor:pointer;min-height:38px;color:var(--ink)}.fil button[aria-pressed=true]{background:var(--g);color:#fff;border-color:var(--g)}.mopen .meal2{border-top:0}

@media(min-width:900px){.bnav{position:sticky;top:64px;bottom:auto;display:flex;justify-content:center;gap:6px;border-top:0;border-bottom:1px solid var(--line);padding:6px}
.tab{flex-direction:row;font-size:16px;min-height:48px;padding:8px 18px;border-radius:10px;gap:8px}.tab[aria-current=true]{background:var(--soft)}
#cta{bottom:0}.toast{bottom:90px}}
.full{display:block;width:100%;margin-top:14px}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;color:var(--mute);font:600 14px Figtree,sans-serif;padding:8px 10px;border-radius:8px;min-height:38px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.m-tupper .seg button[aria-pressed=true]{background:var(--or);color:var(--on-or)}.m-fuera .seg button[aria-pressed=true]{background:var(--mute);color:#fff}
.meal2{padding:12px 0;border-top:1px solid var(--line)}.meal2:first-of-type{border-top:0}
.mh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}.ml{font-weight:600;color:var(--mute)}
.m-fuera input{display:none}.m-tupper input{border-color:var(--or);border-style:dashed}
.xrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;font-size:14px;color:var(--mute)}
.seg2{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:12px;padding:4px;gap:4px;margin-bottom:16px}
.seg2 button{border:0;background:none;color:var(--mute);font:600 15px Figtree,sans-serif;padding:10px 6px;border-radius:9px;min-height:46px;cursor:pointer}
.seg2 button[aria-pressed=true]{background:var(--card);color:var(--g);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.between{justify-content:space-between}
.pbar{height:10px;border-radius:5px;background:var(--soft);overflow:hidden;flex:1}.pbar i{display:block;height:100%;background:var(--g);border-radius:5px}
.prog2{display:flex;align-items:center;gap:12px;margin:8px 0 6px;font-weight:600;font-size:14px}

<script>
{
const SB_URL='https://jxswqiirvlyggrdidqnc.supabase.co',SB_KEY='sb_publishable_RMCr9fE9RPxsAfsw6eqhQg_M6G3BiNs';
const CASA=['lostinlaparra@gmail.com','mariateland@gmail.com'];
const sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
window.CABAC_SB=sb;
const quien=ss=>{if(ss&&ss.user)window.CABAC_YO=/^mariate/i.test(ss.user.email)?'M':'S'};sb.auth.getSession().then(({data})=>quien(data.session));sb.auth.onAuthStateChange((e,ss)=>quien(ss));
let ok;const sesion=new Promise(r=>ok=r);
const H=document.documentElement;
sb.auth.getSession().then(({data})=>{if(data.session)ok(data.session);else H.classList.add('nolog')});
sb.auth.onAuthStateChange((ev,se)=>{if(se){H.classList.remove('nolog');ok(se)}else if(ev==='SIGNED_OUT')H.classList.add('nolog')});
const f=document.getElementById('lform'),m=document.getElementById('lmail'),pw=document.getElementById('lpass'),msg=document.getElementById('lmsg'),btn=document.getElementById('lbtn');
const em=()=>m.value.trim().toLowerCase();
const okMail=()=>{if(!CASA.includes(em())){msg.textContent='Ese correo no es de esta casa.';return false}return true};
const redir=location.origin+location.pathname;
let modoNueva=false;
f.addEventListener('submit',async e=>{e.preventDefault();e.stopPropagation();
  if(modoNueva){const {error}=await sb.auth.updateUser({password:pw.value});msg.textContent=error?'No se pudo: '+error.message:'Contraseña cambiada ✓';if(!error){modoNueva=false;btn.textContent='Entrar';H.classList.remove('nolog')}return}
  if(!okMail())return;btn.disabled=true;msg.textContent='Entrando…';
  const {error}=await sb.auth.signInWithPassword({email:em(),password:pw.value});btn.disabled=false;
  if(error)msg.textContent=/confirm/i.test(error.message)?'Primero confirma tu correo: abre el enlace que te enviamos.':'Correo o contraseña incorrectos.';else msg.textContent=''},true);
document.getElementById('lnew').addEventListener('click',async()=>{if(!okMail())return;if(pw.value.length<6){msg.textContent='Escribe arriba la contraseña que quieras (mínimo 6 caracteres).';pw.focus();return}
  msg.textContent='Creando tu cuenta…';const {data,error}=await sb.auth.signUp({email:em(),password:pw.value,options:{emailRedirectTo:redir}});
  if(error){msg.textContent=/registered|exists/i.test(error.message)?'Ya tienes cuenta: pulsa Entrar.':'No se pudo crear: '+error.message;return}
  msg.textContent=data.session?'':'Te hemos enviado un correo. Abre el enlace para confirmarlo y después vuelve aquí y pulsa Entrar.'});
document.getElementById('lolv').addEventListener('click',async()=>{if(!okMail())return;const {error}=await sb.auth.resetPasswordForEmail(em(),{redirectTo:redir});
  msg.textContent=error?'No se pudo enviar: '+error.message:'Te hemos enviado un enlace para poner una contraseña nueva.'});
sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY'){modoNueva=true;setTimeout(()=>H.classList.add('nolog'),0);document.getElementById('lpaso').textContent='Escribe tu contraseña nueva y pulsa Guardar.';btn.textContent='Guardar contraseña';m.removeAttribute('required')}});
const doc=id=>({
  async get(){const {data,error}=await sb.from('estado').select('doc').eq('id',id).maybeSingle();if(error)throw error;return {data:()=>data?data.doc:null}},
  async set(v){const {data:{session}}=await sb.auth.getSession();const {error}=await sb.from('estado').upsert({id,doc:v,at:(v&&v.at)||Date.now(),updated_by:session&&session.user.email});if(error)throw error},
  async delete(){const {error}=await sb.from('estado').delete().eq('id',id);if(error)throw error},
  onSnapshot(cb){const ch=sb.channel('estado-'+id.replace(/\W/g,'_')).on('postgres_changes',{event:'*',schema:'public',table:'estado',filter:'id=eq.'+id},p=>{if(p.new&&p.new.doc)cb({data:()=>p.new.doc})}).subscribe();return()=>sb.removeChannel(ch)}
});
const assets={async upload(blob){const id=(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2))+'.jpg';
  const {error}=await sb.storage.from('fotos').upload(id,blob,{contentType:blob.type||'image/jpeg'});if(error)throw error;return {id,url:sb.storage.from('fotos').getPublicUrl(id).data.publicUrl}}};
window.CABAC_FOTO=id=>sb.storage.from('fotos').getPublicUrl(id).data.publicUrl;
window.CABAC_SALIR=()=>sb.auth.signOut();
window.claude={use:async n=>{if(n==='db'){await sesion;return {doc}}if(n==='assets'){await sesion;return assets}return null}};
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>

  if(!H.length)return h+`<div class="empty" style="margin-top:14px">Aquí verás cuánto se va cada semana en Mercadona, mercado, droguería y farmacia.</div>`;

async function askJSON(p){
  if(sample.json)return await sample.json(p,{modelTier:'default'});
  const r=await sample(p,{modelTier:'default'});const m=r.text.match(/[\[{][\s\S]*[\]}]/);return JSON.parse(m[0]);
}
function errIA(e){if(e&&e.code==='not_granted'){sample=null;status('Sin permiso para preguntar a Claude.')}else if(e&&e.code==='rate_limited')status('Demasiadas peticiones seguidas; espera un minuto y vuelve a probar.');else status('No he podido traer la respuesta; prueba otra vez.')}

const pReceta=(c,prev)=>`Eres una cocinera doméstica española. Propón recetas para 2 personas para este plato del menú semanal: "${c.plato}" (${c.m==='comida'?'comida de mediodía':'cena'}).
Condiciones: recetas sencillas y ligeras, fáciles de digerir, porque una de las dos personas se nota el estómago inflamado con comidas pesadas. Evita sofritos largos y grasientos, fritos en aceite, legumbres en guiso contundente (si hay legumbre, que sea suave, poca cantidad o en crema/ensalada), nata, embutidos grasos, rebozados y picante fuerte. Si el plato pedido es pesado, propón una versión aligerada reconocible.${c.m==='cena'?' Al ser cena, más ligera todavía.':''}${prev?` No repitas estas recetas: ${prev}.`:''}
Da 2 opciones:
- "tradicional": cocinada al fuego, plancha, vapor u horno.
- "cosori": hecha en la freidora de aire Cosori Dual Blaze TwinFry de 10 L (dos zonas de 5 L que también se usan juntas como una de 10 L, calor por arriba y por abajo). En el campo "cosori" indica qué va en cada zona, temperatura y minutos, y usa la sincronización para que terminen a la vez si usas las dos.
Cantidades para 2 personas. Ingredientes con nombre sencillo de supermercado; unidad: g, ml, ud, cda o cdta.
Responde SOLO con JSON válido, sin texto alrededor:
{"tradicional":{"nombre":"","minutos":0,"por_que_ligera":"una frase","ingredientes":[{"nombre":"","cantidad":0,"unidad":"g"}],"pasos":["paso corto"],"cosori":""},"cosori":{"nombre":"","minutos":0,"por_que_ligera":"","ingredientes":[],"pasos":[],"cosori":"Zona 1: ... · Zona 2: ..."}}`;

async function buscar(keys,otras){
  for(let n=0;n<keys.length;n++){const c=comidas().find(x=>x.k===keys[n]);if(!c||!sample)break;
    busy=`Buscando ${n+1} de ${keys.length}: ${c.plato}…`;render();
    const prev=otras&&S.recetas[c.k]?S.recetas[c.k].op.map(r=>r&&r.nombre).filter(Boolean).join('; '):'';
    try{const r=await askJSON(pReceta(c,prev));
      if(r&&r.tradicional){S.recetas[c.k]={plato:c.plato,op:[r.tradicional,r.cosori||null]};delete S.elegida[c.k];save()}}
    catch(e){errIA(e);if(e&&(e.code==='not_granted'||e.code==='rate_limited'))break}}
  busy='';render();
}

function hashLista(){return comidas().filter(cocina).map(c=>{const r=elegidaDe(c);return r?c.k+':'+r.nombre+':'+c.extra:''}).join('|')}
let autoT=null;function autoLista(){if(busy||tab!=='compra'||superM)return;const h=hashLista();if(!h.replace(/\|/g,'')||h===S.listaHash)return;clearTimeout(autoT);autoT=setTimeout(()=>{if(!busy&&hashLista()!==S.listaHash)hacerLista()},150)}
async function hacerLista(){const prev=S.compra.filter(i=>i.origen==='auto'),keep=(arr)=>{for(const n of arr){const o=prev.find(x=>norm(x.ing||x.producto)===norm(n.ing||n.producto));if(o){n.tengo=o.tengo;n.hecho=o.hecho}}return arr};S.listaHash=hashLista();
  const sel=comidas().filter(cocina).map(c=>({c,r:elegidaDe(c)})).filter(x=>x.r);
  const lines=[],ex={};
  for(const {c,r} of sel){const f=(2+c.extra)/2,dd=`${DIAS[c.d].slice(0,3)} ${c.m}`;for(const g of (r.ingredientes||[])){if(!g.nombre)continue;
    if(g.merc){const key=pkey(g.nombre,g.formato),n=Math.max(1,Math.round(num(g.cantidad)||1));
      if(ex[key]){ex[key].envases+=n;ex[key].para+=', '+dd}
      else{const mem=S.precios[key];ex[key]={id:uid(),ing:String(g.nombre),producto:String(g.nombre),formato:String(g.formato||''),envases:n,precio:mem!=null?mem:num(g.precio),estimado:false,seccion:SECC.includes(g.seccion)?g.seccion:'Otros',para:dd,sobra:'',tengo:false,hecho:false,origen:'auto'}}}
    else{const q=num(g.cantidad);lines.push(`- ${g.nombre}: ${q!=null?Math.round(q*f*10)/10:g.cantidad} ${g.unidad} (${dd}: ${r.nombre}${c.extra?`, ${2+c.extra} raciones con tupper`:''})`)}}}
  const exact=Object.values(ex).map(aplicaV);
  if(!lines.length||!sample){if(lines.length)status('Sin permiso para preguntar a Claude: solo he añadido los productos tal cual de Mercadona.');
    S.compra=[...keep(exact),...S.compra.filter(i=>i.origen==='manual')];save();tab='compra';render();return}
  busy='Actualizando la lista con las recetas…';render();
  const p=`Convierte estos ingredientes (recetas de una semana para 2 personas) en la lista de la compra de Mercadona (España).
- Une los repetidos y suma cantidades.
- Pásalo al formato en que lo vende Mercadona (p. ej. producto "Cebolla", formato "malla 1 kg"; "Huevos L", "docena"; "Pechuga de pollo fileteada", "bandeja aprox. 500 g") y calcula cuántos envases hacen falta, redondeando hacia arriba.
- precio: precio aproximado por envase en Mercadona en euros (tu mejor estimación actual).
- seccion: exactamente una de ${JSON.stringify(SECC)}.
- basico: true si es de despensa que casi siempre hay en casa (sal, aceite de oliva, pimienta, especias, vinagre, ajo en polvo).
- para: a qué días o platos va, muy corto.
- sobra: si sobra bastante, frase muy corta de cómo aprovecharlo; si no, "".
- ingrediente: nombre genérico y corto del ingrediente como lo pide la receta (p. ej. "lubina", "calabacín").
- necesario_cantidad y necesario_unidad: cantidad total que hace falta, en g, ml o ud.
${Object.keys(S.catalogo).length?`- Estos son productos y precios REALES de mi Mercadona, sacados de mis tickets. Si un ingrediente encaja con uno, usa ese nombre como producto, ese precio y pon "real":true:
${Object.entries(S.catalogo).sort((a,b)=>(b[1].f||'').localeCompare(a[1].f||'')).slice(0,200).map(([n,v])=>`  ${n}: ${v.precio} €`).join('\n')}
`:''}Ingredientes:
${lines.join('\n')}
Responde SOLO con un array JSON válido: [{"ingrediente":"","producto":"","formato":"","envases":1,"precio":0,"real":false,"seccion":"","basico":false,"para":"","sobra":"","necesario_cantidad":0,"necesario_unidad":"g"}]`;
  try{const arr=await askJSON(p);
    if(Array.isArray(arr)){const auto=arr.map(x=>{const k=pkey(x.producto,x.formato),mem=S.precios[k];
      const nq=num(x.necesario_cantidad),nu=['g','ml','ud'].includes(x.necesario_unidad)?x.necesario_unidad:null;
      return{id:uid(),ing:String(x.ingrediente||x.producto||''),need:nq&&nu?{q:nq,u:nu}:null,producto:String(x.producto||''),formato:String(x.formato||''),envases:Math.max(1,Math.round(+x.envases||1)),precio:mem!=null?mem:num(x.precio),estimado:mem==null&&!x.real,seccion:SECC.includes(x.seccion)?x.seccion:'Otros',para:String(x.para||''),sobra:String(x.sobra||''),tengo:!!x.basico,hecho:false,origen:'auto'}}).map(aplicaV);
      S.compra=[...keep(exact),...keep(auto),...S.compra.filter(i=>i.origen==='manual')];save();tab='compra'}}
  catch(e){errIA(e)}
  busy='';render();
}

async function aImagen(file,mx=1800){const url=URL.createObjectURL(file);try{const img=await new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ko;i.src=url});
  const sc=Math.min(1,mx/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);return await new Promise(ok=>c.toBlob(ok,'image/jpeg',.85))}finally{URL.revokeObjectURL(url)}}
async function subeFoto(k,file){if(!assets){status('Para subir fotos hace falta permiso.');return}status('Subiendo foto…');
  try{const b=await aImagen(file,700);const r=await assets.upload(b);S.fotos[k]=r.id;save();render();status('Foto guardada ✓')}catch(e){status('No se pudo subir la foto.')}}
async function leerTicket(){
  const f=$('#tkImg')&&$('#tkImg').files[0],txt=($('#tkTxt')||{}).value||'';
  if(!f&&!txt.trim()){ticketMsg='Sube una foto o pega el texto primero.';render();return}
  busy='Leyendo el ticket…';ticketMsg='';render();
  const p=`${f?'La imagen es':'Este texto es'} un ticket de compra de Mercadona. Extrae cada línea de producto.
Empareja cada línea con un artículo de mi lista si es el mismo producto (pon su id), o null si no está.
Mi lista: ${JSON.stringify(S.compra.map(i=>({id:i.id,p:(i.producto+' '+i.formato).trim()})))}
Para productos a peso, unidades = 1 y precio_unidad = importe.
${txt.trim()?'Texto del ticket:\n'+txt.slice(0,6000):''}
Responde SOLO con JSON válido: {"total":0,"lineas":[{"producto":"nombre tal cual en el ticket","unidades":1,"precio_unidad":0,"importe":0,"id":null}]}`;
  try{let r;const o={modelTier:'default'};if(f)o.images=[await aImagen(f)];
    if(sample.json)r=await sample.json(p,o);else{const a=await sample(p,o);r=JSON.parse(a.text.match(/\{[\s\S]*\}/)[0])}
    const L=Array.isArray(r&&r.lineas)?r.lineas:[];let act=0;const hoy=new Date().toISOString().slice(0,10);
    for(const l of L){const pu=num(l.precio_unidad);if(pu==null||!l.producto)continue;
      S.catalogo[String(l.producto).trim()]={precio:pu,f:hoy};
      const i=S.compra.find(x=>x.id===l.id);if(i){i.precio=pu;i.estimado=false;S.precios[pkey(i.producto,i.formato)]=pu;act++}}
    const tot=num(r&&r.total)??L.reduce((a,l)=>a+(num(l.importe)||0),0);
    if(L.length){S.real={total:tot};ticketMsg=`Leído: ${L.length} líneas, ${act} precios de la lista actualizados, total ${eur(tot)}.`}else ticketMsg='No he encontrado líneas de producto; prueba con una foto más nítida o pega el texto.';
    save()}
  catch(e){errIA(e);ticketMsg='No he podido leer el ticket.'}
  busy='';render();
}

  else if(a==='realman'){const v=num(($('#realTot')||{}).value||'');if(v!=null){S.real={total:v};save();status('Gasto real guardado.');render()}}

  else if(a==='regm'){const x=parseM(qAdd);if(x){const k=regCat(x);const ex=S.compra.find(i=>ckey(i)===k);if(ex)ex.envases++;else S.compra.push({id:uid(),ing:x.n,ok:true,producto:x.n,formato:x.f,envases:1,precio:x.p,estimado:false,seccion:x.sec,para:'',sobra:'',tengo:false,hecho:false,origen:'manual'});

    if(item.need){const cv=cubre(item,{f:x.f});item.envases=cv.env}delete pmTmp[id];save();status('Elegido y guardado. La próxima vez «'+ing+'» será '+x.n+'.');render()}}
  else if(a==='addgen'){const q=qAdd.trim();if(q){S.compra.push(aplicaV({id:uid(),ing:q,producto:q,formato:'',envases:1,precio:S.precios[pkey(q,'')]??null,estimado:false,seccion:guessSec(q),para:'',sobra:'',tengo:false,hecho:false,origen:'manual'}));qAdd='';save();render()}}

  else if(a==='eedit'){const r=S.libro.find(x=>x.id===id);if(r){ed=JSON.parse(JSON.stringify(r));render();scrollTo(0,0)}}
  else if(a==='eborrar'){borrando=id;render()}
  else if(a==='enoborra'){borrando=null;render()}
  else if(a==='eborra'){marcaB('r:'+id);S.libro=S.libro.filter(x=>x.id!==id);for(const q in S.mias)if(S.mias[q]===id){delete S.mias[q];if(S.elegida[q]===2)delete S.elegida[q]}borrando=null;save();render()}
  else if(ed&&a==='eadd'){ed.ingredientes.push({nombre:'',cantidad:'',unidad:'g',merc:false});render()}
  else if(ed&&a==='edel'){ed.ingredientes.splice(+t.dataset.i,1);render()}
  else if(ed&&a==='emerc'){const g=ed.ingredientes[+t.dataset.i];g.merc=!g.merc;if(g.merc){g.cantidad=g.cantidad&&num(g.cantidad)<10?g.cantidad:'1';g.seccion=g.seccion||'Otros'}render()}
  else if(ed&&a==='ecancel'){const p=ed.para;ed=null;if(p)tab='recetas';render()}
  else if(ed&&a==='eguarda'){if(!ed.nombre.trim()){status('Ponle un nombre a la receta.');return}
    ed.ingredientes=ed.ingredientes.filter(g=>g.nombre.trim());for(const g of ed.ingredientes)if(g.merc)g.precio=num(g.precio);
    const p=ed.para;delete ed.para;if(!ed.id)ed.id=uid();const ix=S.libro.findIndex(x=>x.id===ed.id);if(ix>=0)S.libro[ix]=ed;else S.libro.push(ed);
    if(p){S.mias[p]=ed.id;S.elegida[p]=2;tab='recetas'}ed=null;save();status('Receta guardada ✓');render()}
  else if(item&&a==='hecho'){item.hecho=t.checked;if(t.checked&&okI(item)){S.usos=S.usos||{};const kk=ckey(item);S.usos[kk]=(S.usos[kk]||0)+1}if(navigator.vibrate)navigator.vibrate(10);save();render()}
  else if(item&&a==='tengo'){item.tengo=!item.tengo;save();render()}
  else if(item&&a==='mas'){item.envases++;save();render()}
  else if(item&&a==='menos'){item.envases=Math.max(1,item.envases-1);save();render()}
  else if(a==='borra'){quita(id)}
  else if(a==='desmarcar'){S.compra.forEach(i=>i.hecho=false);S.otras.forEach(i=>i.hecho=false);save();render()}
  else if(a==='ohecho'){const o=S.otras.find(i=>i.id===id);if(o){o.hecho=t.checked;save();render()}}
  else if(a==='oborra'){marcaB(id);S.otras=S.otras.filter(i=>i.id!==id);save();render()}
  else if(a==='precerrar'){confirmCierre=true;render()}
  else if(a==='nocerrar'){confirmCierre=false;render()}
  else if(a==='cerrar'){const T=totales();S.historial.push({semana:S.semana,mercadona:+T.m.toFixed(2),estimado:+T.est.toFixed(2),real:!!S.real,otras:Object.fromEntries(Object.entries(T.o).map(([x,v])=>[x,+v.toFixed(2)])),total:+T.t.toFixed(2)});
    S.compra.forEach(i=>marcaB(i.id));S.otras.forEach(i=>marcaB(i.id));
    const nueva=[...(S.proxima||[]),...Object.values(S.fijos||{})].filter((x,ix,arr)=>arr.findIndex(y=>norm(y.producto)===norm(x.producto))===ix).map(x=>aplicaV({id:uid(),ing:x.producto,producto:x.producto,formato:x.formato||'',envases:1,precio:x.precio??null,estimado:false,seccion:x.seccion||guessSec(x.producto),para:'',sobra:'',tengo:false,hecho:false,origen:'manual'}));
    S.menuPrev=JSON.parse(JSON.stringify(S.menu));S.findePrev=S.finde;
    Object.assign(S,{semana:lunesDe(S.semana,1),menu:{},recetas:{},elegida:{},mias:{},compra:nueva,otras:[],real:null,proxima:[],listaHash:''});confirmCierre=false;save();status(nueva.length?nueva.length+' cosas ya en la lista nueva (lo que quedaba poco y lo de cada semana).':'Semana nueva empezada.');render()}

document.addEventListener('focusin',e=>{if(e.target.id==='qAdd'){document.body.classList.add('typing');setTimeout(()=>{const b=e.target.closest('.sbox');b&&b.scrollIntoView({block:'start',behavior:'smooth'})},250)}});
document.addEventListener('focusout',e=>{if(e.target.id==='qAdd')setTimeout(()=>{if(!document.activeElement||document.activeElement.id!=='qAdd')document.body.classList.remove('typing')},300)});
document.addEventListener('paste',e=>{const t=e.target;if(t.id!=='qAdd'||!e.clipboardData)return;const tx=e.clipboardData.getData('text')||'';
  if(/\n/.test(tx.trim())&&!parseM(tx)){e.preventDefault();t.value=tx.trim().split(/\s*\n\s*/).join(', ');qAdd=t.value;$('#sug').innerHTML=rSug()}});
document.addEventListener('keydown',e=>{if(e.target.id==='qAdd'&&e.key==='Enter'){e.preventDefault();const b=document.querySelector('#sug [data-act=regm]')||document.querySelector('#sug [data-act=addvarias]')||document.querySelector('#sug .sgi')||document.querySelector('#sug [data-act=addgen]');if(b)b.click();return}
  const t=e.target.closest('[data-act=elige]');if(t&&(e.key==='Enter'||e.key===' ')){e.preventDefault();t.click()}});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='libQ'){libQ=t.value;render();const n=$('#libQ');if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}return}
  if(t.id==='catQ'){catQ=t.value;$('#catL').innerHTML=rCatList();return}
  if(t.id==='qAdd'){qAdd=t.value;$('#sug').innerHTML=rSug();return}
  if(t.dataset.pm){const x=parseM(t.value);if(x)pmTmp[t.dataset.pm]=x;else delete pmTmp[t.dataset.pm];const r=$('#pmr-'+t.dataset.pm);if(r)r.innerHTML=x?rPm(t.dataset.pm):(t.value.trim()?'<p class="note">No reconozco el producto. Copia también el formato y el precio (p. ej. «Bandeja 560 g aprox. … 2,24 € por unidad»).</p>':'');return}
  if(ed&&t.dataset.ed){ed[t.dataset.ed]=t.value}
  if(ed&&t.dataset.ei){ed.ingredientes[+t.dataset.ei][t.dataset.f]=t.value}
  if(t.dataset.plato){const v=S.menu[t.dataset.plato]||(S.menu[t.dataset.plato]={});v.plato=t.value;save()}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.plato){render();return}
  if(ed&&t.dataset.ei&&t.dataset.f==='nombre'){const g=ed.ingredientes[+t.dataset.ei],c=g.merc&&catItems().find(x=>x.k===t.value);if(c){g.nombre=c.n;g.formato=c.f;g.precio=c.p;render();return}}
  if(t.dataset.foto&&t.files&&t.files[0]){subeFoto(t.dataset.foto,t.files[0]);return}
  if(t.dataset.sec){const it=S.compra.find(x=>x.id===t.dataset.sec);if(it){it.seccion=t.value;const c=S.catalogo[ckey(it)];if(c)c.sec=t.value;save();status('Sección cambiada a '+t.value+'.');render()}return}
  if(t.dataset.usa){const k=t.dataset.usa;if(t.value){S.mias[k]=t.value;S.elegida[k]=2}else{delete S.mias[k];if(S.elegida[k]===2)delete S.elegida[k]}save();render();return}
  if(t.dataset.precio){const i=S.compra.find(x=>x.id===t.dataset.precio);if(i){i.precio=num(t.value);i.estimado=false;if(i.precio!=null)S.precios[pkey(i.producto,i.formato)]=i.precio;save();render()}}
  if(t.dataset.oprecio){const i=S.otras.find(x=>x.id===t.dataset.oprecio);if(i){i.precio=num(t.value);if(i.precio!=null)S.precios['otras:'+i.producto.toLowerCase()]=i.precio;save();render()}}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,p=(f.elements.p||{value:''}).value.trim();if(!p)return;
  if(f.id==='addP'){S.proxima=S.proxima||[];S.proxima.push({id:uid(),producto:p,formato:'',precio:S.precios[pkey(p,'')]??null,seccion:guessSec(p)})}

  else if(f.id==='addM'){const pr=num(f.pr.value),mem=S.precios[pkey(p,'')];S.compra.push({id:uid(),producto:p,formato:'',envases:Math.max(1,+f.n.value||1),precio:pr!=null?pr:(mem??null),estimado:false,seccion:f.s.value,para:'',sobra:'',tengo:false,hecho:false,origen:'manual'});if(pr!=null)S.precios[pkey(p,'')]=pr}
  else if(f.dataset.lista){const pr=num(f.pr.value),mem=S.precios['otras:'+p.toLowerCase()];S.otras.push({id:uid(),lista:f.dataset.lista,producto:p,cant:Math.max(1,+f.n.value||1),precio:pr!=null?pr:(mem??null),hecho:false});if(pr!=null)S.precios['otras:'+p.toLowerCase()]=pr}
  save();render();});

function entrante(){let p;try{p=new URLSearchParams(location.search)}catch(e){return}const t=[p.get('title'),p.get('text')].filter(Boolean).join(' ').trim();if(!t&&!p.get('url'))return;
  const limpio=t.replace(/https?:\/\/\S+/g,'').replace(/\s*[|·–-]\s*Mercadona.*$/i,'').replace(/^[¡!¿\s]*(mira|echa un vistazo|te comparto|descubre|he encontrado)[^:!]*[:!]*\s*/i,'').replace(/^[\s:!¡.,-]+|[\s:!¡.,-]+$/g,'').replace(/\s+/g,' ').trim();
  const uu=p.get('url')||(t.match(/https?:\/\/\S+/)||[])[0]||'';let deUrl='';
  try{const mm=decodeURIComponent(uu).match(/mercadona\.es\/product\/\d+\/([a-z0-9-]+)/i);if(mm){deUrl=mm[1].replace(/-/g,' ').trim();deUrl=deUrl.charAt(0).toUpperCase()+deUrl.slice(1)}}catch(e){}
  try{history.replaceState(null,'',location.pathname)}catch(e){}
  if(!limpio&&!deUrl)return;
  if(!limpio||/^(mira|echa un vistazo|te comparto|descubre)/i.test(limpio)&&deUrl)p.set('title',deUrl);
  const limpio2=limpio||deUrl;let x=null;const ti=(p.get('title')||'').replace(/\s*[|·–-]\s*Mercadona.*$/i,'').trim();
  if(ti){const tx=(p.get('text')||'').replace(/https?:\/\/\S+/g,' ');const y=parseM('x '+tx),pp=tx.match(/(\d+(?:[.,]\d+)?)\s*€\s*(?:\/\s*)?(?:por\s*)?(?:unidad|ud\.?|pack)?/i);x={n:ti,f:y?y.f:'',p:y&&y.p!=null?y.p:(pp?num(pp[1]):null),sec:guessSec(ti)};if(!y&&x.p==null){const z=parseM(limpio2);if(z&&z.n.length>=ti.length-2)x=z}}else x=parseM(limpio2);
  if(x){regCat(x);S.compra.push({id:uid(),ing:x.n,ok:true,producto:x.n,formato:x.f,envases:1,precio:x.p,estimado:false,seccion:x.sec,para:'',sobra:'',tengo:false,hecho:false,origen:'manual'})}
  else S.compra.push(aplicaV({id:uid(),ing:limpio2,producto:limpio2,formato:'',envases:1,precio:S.precios[pkey(limpio2,'')]??null,estimado:false,seccion:guessSec(limpio2),para:'',sobra:'',tengo:false,hecho:false,origen:'manual'}));
  tab='compra';save();render();status('«'+(x?x.n:limpio2)+'» añadido a la lista.')}
async function buzon(){if(!db)return;try{const ref=db.doc('app/importar'),v=val(await ref.get());
  if(v&&v.menu&&typeof v.menu==='object'){for(const [k,x] of Object.entries(v.menu))if(/^\d-(comida|cena)$/.test(k)&&x&&typeof x==='object')S.menu[k]=Object.assign(S.menu[k]||{},{plato:String(x.plato??(S.menu[k]||{}).plato??''),fuera:!!x.fuera,tupper:!!x.tupper});if(!v.catalogo){await ref.delete();save();render()}}
  if(v&&v.catalogo&&typeof v.catalogo==='object'){let n=0;for(const [k,x] of Object.entries(v.catalogo)){const p=num(x&&x.precio);if(p==null)continue;S.catalogo[String(k)]={precio:p,f:String(x.f||''),sec:SECC.includes(x.sec)?x.sec:'Otros'};n++}
    await ref.delete();if(n){save();render();status(n+' producto'+(n>1?'s':'')+' nuevos en el catálogo ✓')}}}catch(e){}}
let diferido=false;
function aplicaRemoto(v){const L=S,R=Object.assign(blank(),JSON.parse(v.json)),del=new Set(R.borr||[]);
  for(const K of ['catalogo','vinculos','fotos','precios','usos']){const m=Object.assign({},L[K]||{},R[K]||{});if(K==='catalogo')for(const k in m)if(del.has('c:'+k))delete m[k];R[K]=m}
  S=R;lastAt=v.at;arregla();detectaNuevos(true);
  const ae=document.activeElement;if(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)&&$('#view').contains(ae)){if(!diferido){diferido=true;ae.addEventListener('blur',()=>{diferido=false;render()},{once:true})}rTicket()}else render();
  }
function escucha(){try{const ref=db.doc('app/estado');if(typeof ref.onSnapshot!=='function')return;
  ref.onSnapshot(snap=>{const v=val(snap);if(v&&v.json&&v.at>lastAt&&!pend&&!busy)aplicaRemoto(v)},()=>{})}catch(e){}}
setInterval(()=>{if(!document.hidden)refrescar()},20000);
async function refrescar(){if(!db||pend||busy)return;try{const v=val(await db.doc('app/estado').get());
  if(v&&v.json&&v.at>lastAt&&!pend)aplicaRemoto(v)}catch(e){}buzon()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refrescar()});
window.addEventListener('focus',refrescar);
arregla();render();
const C=window.claude;
if(C&&C.use){
  C.use('sample').then(async s=>{sample=s;try{imgOK=!!(s&&s.limits&&(await s.limits()).images)}catch(e){}render()}).catch(()=>{});
  C.use('assets').then(a=>{assets=a;if(a)render()}).catch(()=>{});
  C.use('db').then(async d=>{if(!d){status('Guardado solo en este navegador.');return}db=d;
    const timer=setTimeout(()=>status('La nube tarda en responder; se guarda en este navegador.'),10000);
    try{const snap=await db.doc('app/estado').get();clearTimeout(timer);
      const v=val(snap);
      if(v&&v.json){S=Object.assign(blank(),JSON.parse(v.json));lastAt=v.at||0;arregla();detectaNuevos(true);render()}buzon();if(arregla())render();escucha();entrante()}
    catch(e){clearTimeout(timer);status('No se pudo leer la nube; uso lo guardado en este navegador.')}}).catch(()=>{});
}
}
